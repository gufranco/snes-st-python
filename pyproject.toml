[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "snesst"
description = "The ST010, the navigation coprocessor one Super Nintendo racing cartridge carried, settled against its own reference implementation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["version"]
keywords = ["snes", "st010", "st011", "coprocessor", "emulator", "conformance", "retrocomputing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Emulators",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/gufranco/snes-st-python"
Source = "https://github.com/gufranco/snes-st-python"
Issues = "https://github.com/gufranco/snes-st-python/issues"

[tool.setuptools]
packages = ["snesst"]

[tool.setuptools.dynamic]
version = { attr = "snesst.version.VERSION" }

[tool.setuptools.package-data]
snesst = ["artifacts.manifest.json"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["nec-upd7725-96050-python"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "BLE", "C4", "N", "A", "T20", "PTH"]
ignore = [
  "PLR0913",
  "PLR2004",
  "PLR0912",
  "PLR0915",
  "PLR0911",
  "PLC0415",
  "PLR0917",
  "E501",
  "N818",
]

[tool.ruff.lint.per-file-ignores]
"snesst/environment.py" = ["BLE001", "T201"]
"*.test.py" = ["PLR2004", "N999"]
"conformance/*.py" = ["T201"]
"snesst/doctor.py" = ["BLE001", "T201"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unreachable = true
warn_no_return = true
strict_equality = true
extra_checks = true
enable_error_code = [
  "explicit-override",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
  "truthy-iterable",
  "unused-awaitable",
]
files = ["snesst", "conformance"]

[tool.coverage.run]
source = ["."]
omit = [
  "arm6-python/*",
  "nec-upd7725-96050-python/*",
  "snes-driver-python/*",
  "snesst/microcode.test.py",
]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
  'if __name__ == "__main__":',
  'if str\(ROOT\) not in sys\.path:',
  'if TYPE_CHECKING:',
  '^\s*\.\.\.$',
  ': \.\.\.$',
]

[[tool.mypy.overrides]]
module = ["arm6.*", "upd7725.*", "mapper.*", "snesdriver.*"]
follow_imports = "skip"
ignore_missing_imports = true
