[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "st010"
description = "The ST010, the navigation coprocessor one Super Nintendo racing cartridge carried, settled against its own reference implementation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["version"]
keywords = ["snes", "st010", "coprocessor", "emulator", "conformance", "retrocomputing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Emulators",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/gufranco/snes-st010-python"
Source = "https://github.com/gufranco/snes-st010-python"
Issues = "https://github.com/gufranco/snes-st010-python/issues"

[tool.setuptools]
packages = ["st010"]

[tool.setuptools.dynamic]
version = { attr = "st010.version.VERSION" }

[tool.setuptools.package-data]
st010 = ["artifacts.manifest.json"]

[tool.setuptools.exclude-package-data]
st010 = ["*.test.py"]

[tool.ruff]
target-version = "py312"
line-length = 100
# The processor is another project checked out inside this one. It carries its
# own gate at its own version, and this repository's lint passing or failing
# should never depend on a commit made in a different repository.
extend-exclude = ["nec-upd7725-96050-python"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "BLE", "C4", "N", "A", "T20", "PTH"]
ignore = [
  "PLR0913",
  "PLR2004",
  "PLR0912",
  "PLR0915",
  "PLR0911",
  "PLC0415",
  "PLR0917",
  "E501",
  # N818 wants every exception to end in Error. Three of these are control flow
  # signals rather than failures, and CPython names its own that way:
  # StopIteration, SystemExit and GeneratorExit carry no suffix either. The
  # exceptions here that genuinely report a failure do end in Error.
  "N818",
]

[tool.ruff.lint.per-file-ignores]
# A test file sits beside the module it covers and is named after it, so its
# module name carries a dot that N999 rejects. The layout is deliberate: a
# module and its tests are read together.
"*.test.py" = ["PLR2004", "N999"]
# These are command line tools. Printing is their output, not a stray debug
# statement left behind, and routing it through a logger would put a level and
# a timestamp in front of a report meant to be read by a person.
"conformance/*.py" = ["T201"]
# The doctor exists so that nothing fails silently, which means it has to survive
# whatever a check throws at it and report that rather than propagate it. A
# narrower catch here would let an unforeseen failure escape as a traceback and
# take the rest of the report with it, which is the one outcome it must avoid.
# It prints for the same reason every tool here does: its output is the product.
"st010/doctor.py" = ["BLE001", "T201"]

[tool.mypy]
# Every flag mypy has, plus the ones strict does not turn on. The errors that
# matter in a model of hardware are the ones where a width, a mask or a None
# crosses a boundary, and those are exactly what the optional classes catch.
strict = true
python_version = "3.12"
warn_unreachable = true
warn_no_return = true
strict_equality = true
extra_checks = true
enable_error_code = [
  "explicit-override",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "truthy-bool",
  "truthy-iterable",
  "unused-awaitable",
]
files = ["st010", "conformance"]

[tool.coverage.run]
source = ["st010", "conformance"]
# The checks that drive real microcode are measured out of the gate on purpose.
# They depend on a file nobody may distribute, so a machine that has one runs a
# set of paths a machine without one cannot. No single build can exercise both,
# and a gate that demands the impossible gets switched off rather than met. What
# they do instead is report as skipped, out loud.
omit = ["st010/microcode.test.py"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
  # The command line guard hands argv to a function that is itself tested, so
  # there is nothing behind it left to exercise. Importing the module to cover
  # the guard would run the tool rather than test it.
  'if __name__ == "__main__":',
  # The doctor puts its own repository on the import path so that it still runs
  # when the package will not import, which is the case it exists for. A suite
  # that imports the doctor has already put it there, so the branch the guard
  # takes when running as a file is one no test can be in.
  'if str\(ROOT\) not in sys\.path:',
  # A type checking block never runs, by definition. Python 3.14 drops it before
  # coverage can see it and earlier versions do not, so leaving it in would make
  # the gate mean one thing on the newest runtime and another on the oldest
  # supported one, which is worse than either.
  'if TYPE_CHECKING:',
  # A protocol method has no body to run, whether the ellipsis sits on its own
  # line or after the signature. The same version split applies.
  '^\s*\.\.\.$',
  ': \.\.\.$',
]

[[tool.mypy.overrides]]
# The submodule is checked in its own repository, against its own gate.
# Following imports into it here would report the state of somebody else's
# project, and a finding nobody in this one can act on.
module = ["upd7725.*"]
follow_imports = "skip"
ignore_missing_imports = true
