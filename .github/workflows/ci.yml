---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pipx install ruff==0.16.3

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install the formatter
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check that every file Prettier reads is formatted
        run: pnpm run format:check

      - name: Lint every YAML file
        run: |
          pipx install yamllint==1.38.0
          yamllint --strict .

  types:
    name: Types
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install mypy and the setuptools stubs
        run: |
          pipx install mypy==1.14.1
          pipx inject mypy types-setuptools==84.0.0.20260812

      - name: Check types
        run: mypy

  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install coverage and the build backend its tests drive
        run: |
          python -m pip install --disable-pip-version-check \
            coverage==7.6.10 setuptools==84.0.0

      - name: Run every test file, under coverage
        run: |
          python -m coverage erase
          status=0
          while IFS= read -r file; do
            echo "::group::${file}"
            python -m coverage run -a "${file}" || status=1
            echo "::endgroup::"
          done < <(find snesst conformance -name '*.test.py' | sort)
          exit "${status}"
        shell: bash

      - name: Coverage must be total
        run: python -m coverage report

  speed:
    name: Throughput
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: The part must still run faster than the floor
        run: python -m conformance.speed

  microcode:
    name: Against the parts, when any microcode is present
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Start every part and confirm it reaches its own wait
        run: |
          set +e
          python -c "
          import snesst
          from snesst import chip, models
          reason = chip.why_not()
          if reason:
              print('  nothing was run:', reason)
              raise SystemExit(2)
          for name in sorted(models.MODELS):
              part = snesst.Chip(name)
              where = part.core.registers.pc
              print(f'  {name}: booted, waiting at word {where}')
              assert where in chip.COMMAND_LOOP[name], (name, where)
          "
          status=$?
          set -e
          if [ "${status}" -eq 2 ]; then
            notice="The checks that start a part's own program did not run."
            notice="${notice} They are not failures; they had nothing to run."
            echo "::notice title=No microcode present::${notice}"
            exit 0
          fi
          exit "${status}"
        shell: bash

      - name: Play the exchanges real cartridges make
        run: |
          set +e
          status=0
          for part in st010 st011 st018; do
            echo "::group::${part}"
            python -m conformance.against_cartridges "${part}"
            here=$?
            echo "::endgroup::"
            [ "${here}" -eq 0 ] || status="${here}"
          done
          set -e
          if [ "${status}" -eq 2 ]; then
            notice="The exchanges were not played."
            notice="${notice} They are not failures; there was no part to play them at."
            echo "::notice title=No microcode present::${notice}"
            exit 0
          fi
          exit "${status}"
        shell: bash

      - name: Run the program dumps the record names and compare their verdicts
        run: |
          set +e
          python -m conformance.testroms "${SNES_ST_FIRMWARE_DIR:-firmware}"
          status=$?
          set -e
          if [ "${status}" -eq 2 ]; then
            notice="The recorded program dumps were not run."
            notice="${notice} They are not failures; none of them is on this runner."
            echo "::notice title=No program dump present::${notice}"
            exit 0
          fi
          exit "${status}"
        shell: bash

      - name: Say on the run page whether the part was driven at all
        run: |
          set +e
          python -c "
          import sys
          sys.path.insert(0, '.')
          from snesst import chip
          reason = chip.why_not()
          print(reason if reason else '')
          raise SystemExit(2 if reason else 0)
          " > reason.txt
          status=$?
          set -e
          if [ "${status}" -eq 2 ]; then
            echo "::notice title=No microcode present::$(cat reason.txt)"
            exit 0
          fi
          notice="Every part this package covers was built from its own image and driven."
          echo "::notice title=Microcode present::${notice}"
          exit "${status}"
        shell: bash

  package:
    name: package
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Every module ships and no test does
        run: python -m conformance.package dist/snesst-*.whl
