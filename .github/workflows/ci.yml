name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      # The package reaches the processor through this submodule, and without it
      # the microcode backend cannot be built at all. Checking it out here does
      # not supply any firmware, so the runner still exercises the path a user
      # without an image takes.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pipx install ruff==0.16.3

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install the formatter
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check that every JSON file is formatted
        run: pnpm run format:check

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install mypy
        run: pipx install mypy==1.14.1

      # Strict, with every optional error class the checker offers. The
      # configuration lives in pyproject.toml so this run and a local one are
      # the same run.
      - name: Check types
        run: mypy

  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      # The package reaches the processor through this submodule, and without it
      # the microcode backend cannot be built at all. Checking it out here does
      # not supply any firmware, so the runner still exercises the path a user
      # without an image takes.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install coverage
        run: python -m pip install --disable-pip-version-check coverage==7.6.10

      - name: Run every test file, under coverage
        run: |
          python -m coverage erase
          status=0
          while IFS= read -r file; do
            echo "::group::${file}"
            python -m coverage run -a "${file}" || status=1
            echo "::endgroup::"
          done < <(find snesst conformance -name '*.test.py' | sort)
          exit "${status}"
        shell: bash

      - name: Coverage must be total
        run: python -m coverage report

  speed:
    name: Throughput
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: The part must still run faster than the floor
        run: python -m conformance.speed

  microcode:
    name: Against the parts, when any microcode is present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # This runs the program a cartridge carries, which belongs to whoever
      # wrote it, so on a machine without one it says so and stops rather than
      # reporting a pass. Everything a machine without one can check runs in the
      # test job above: this package has no behaviour of its own to get wrong.
      - name: Start every part and confirm it reaches its own wait
        run: |
          set +e
          python -c "
          import snesst
          from snesst import chip, models
          reason = chip.why_not()
          if reason:
              print('  nothing was run:', reason)
              raise SystemExit(2)
          for name in sorted(models.MODELS):
              part = snesst.Chip(name)
              where = part.core.registers.pc
              print(f'  {name}: booted, waiting at word {where}')
              assert where in chip.COMMAND_LOOP[name], (name, where)
          "
          status=$?
          set -e
          if [ "${status}" -eq 2 ]; then
            echo "::notice title=No microcode present::The checks that start a part's own program did not run. They are not failures; they had nothing to run."
            exit 0
          fi
          exit "${status}"
        shell: bash

      # What the part says back when it is driven the way a cartridge drives it.
      # The exchanges come out of the three retail cartridges that carry these
      # parts, read out of their own code rather than guessed at, and are checked
      # in beside the conformance suite with the digests of the cartridges they
      # came from. A part that answers nothing to every one of them is what a
      # wrong image or a broken decode looks like.
      - name: Play the exchanges real cartridges make
        run: |
          set +e
          status=0
          for part in st010 st011; do
            echo "::group::${part}"
            python -m conformance.against_cartridges "${part}"
            here=$?
            echo "::endgroup::"
            [ "${here}" -eq 0 ] || status="${here}"
          done
          set -e
          if [ "${status}" -eq 2 ]; then
            echo "::notice title=No microcode present::The exchanges were not played. They are not failures; there was no part to play them at."
            exit 0
          fi
          exit "${status}"
        shell: bash

      # The tests that need a real image are skipped without one, and a skipped
      # test and a passing one print the same thing at the end of a run. This
      # says which happened, on the page a person actually opens.
      - name: Say on the run page whether the part was driven at all
        run: |
          set +e
          python -c "
          import sys
          sys.path.insert(0, '.')
          from snesst import chip
          reason = chip.why_not()
          print(reason if reason else '')
          raise SystemExit(2 if reason else 0)
          " > reason.txt
          status=$?
          set -e
          if [ "${status}" -eq 2 ]; then
            echo "::notice title=No microcode present::$(cat reason.txt)"
            exit 0
          fi
          echo "::notice title=Microcode present::Every part this package covers was built from its own image and driven."
          exit "${status}"
        shell: bash
